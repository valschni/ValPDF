name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android-Lizenzen akzeptieren
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Projekt zusammenbauen
        run: bash bauen.sh

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK zum Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create apk app/build/outputs/apk/debug/app-debug.apk --title "PDF Werkzeug" --notes "Neueste Version" --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Werkzeug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
